[project]
name = "hashed-rag"
version = "0.1.0"
description = "Retrieval-grounded sales assistant replacing the website contact form"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI Depends() in defaults is the documented idiom
    "RUF012", # mutable class attrs are fine on pydantic models
    "RUF001", # en/em dashes in the money regexes are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
