# ─────────────────────────────────────────────────────────────────────────
#  THE ONLY SOURCE OF NUMBERS.
#
#  The chatbot can never invent, round or interpolate a price: it may only
#  relay a row from this file, returned verbatim by the `lookup_pricing` tool.
#  Edit here and the bot quotes the new figure on the next request — no
#  re-indexing, no redeploy.
#
#  market_price = what the visitor would typically pay elsewhere
#  our_price    = what we are offering
#  The discount is derived, never hand-written, so it cannot drift.
# ─────────────────────────────────────────────────────────────────────────

currency: USD

# Shown alongside every quote so a figure is never presented as a fixed bid.
